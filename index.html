<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Integrado: Monitoramento de Água & IA</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .main-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 1100px;
    }
    h1 {
      color: #0077b6;
      text-align: center;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn {
      background-color: #0077b6;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #005f92;
    }
    .status {
      text-align: center;
      font-size: 14px;
      margin-bottom: 25px;
      color: #666;
    }
    .dashboard-layout {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 25px;
      margin-bottom: 30px;
    }
    @media (max-width: 768px) {
      .dashboard-layout {
        grid-template-columns: 1fr;
      }
    }
    /* Estilos da Seção Teachable Machine */
    .ai-section {
      background: #fafafa;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      text-align: center;
    }
    #webcam-container canvas {
      border-radius: 8px;
      max-width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 10px;
    }
    #label-container {
      margin-top: 15px;
      text-align: left;
    }
    .label-item {
      background: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #ddd;
      font-size: 14px;
      font-weight: 500;
    }
    /* Estilos do Painel de Sensores */
    .grid-sensors {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .card {
      background: #eef4f8;
      padding: 18px;
      border-radius: 8px;
      border-left: 5px solid #0077b6;
      text-align: center;
    }
    .card h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #555;
    }
    .card .valor {
      font-size: 22px;
      font-weight: bold;
      color: #1d3557;
    }
    /* Seção dos Gráficos */
    .charts-section {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .grid-charts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 768px) {
      .grid-charts {
        grid-template-columns: 1fr;
      }
    }
    .chart-container {
      position: relative;
      height: 220px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>Estação de Qualidade da Água & IA</h1>

    <div class="controls">
      <button class="btn" onclick="initCamera()">1. Iniciar Câmera (IA)</button>
      <button class="btn" onclick="conectarArduino()">2. Conectar Arduino USB</button>
    </div>

    <div class="status" id="status-conexao">Status: Aguardando conexões...</div>

    <div class="dashboard-layout">
      <!-- Seção da Webcam e Classificação por IA -->
      <div class="ai-section">
        <h2 style="font-size: 18px; color: #333; margin-top: 0;">Análise Visual (Teachable Machine)</h2>
        <div id="webcam-container"></div>
        <div id="label-container"></div>
      </div>

      <!-- Seção dos Sensores em Tempo Real -->
      <div class="sensors-section">
        <h2 style="font-size: 18px; color: #333; margin-top: 0; text-align: center;">Valores Atuais</h2>
        <div class="grid-sensors">
          <div class="card">
            <h3>TEMPERATURA</h3>
            <div class="valor"><span id="temp">--</span> °C</div>
          </div>
          <div class="card">
            <h3>pH DA ÁGUA</h3>
            <div class="valor"><span id="ph">--</span></div>
          </div>
          <div class="card">
            <h3>TDS (Sólidos)</h3>
            <div class="valor"><span id="tds">--</span> ppm</div>
          </div>
          <div class="card">
            <h3>TURBIDEZ</h3>
            <div class="valor"><span id="turb">--</span> NTU</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Seção de Histórico e Variação com Gráficos -->
    <div class="charts-section">
      <h2 style="font-size: 18px; color: #333; margin-top: 0; text-align: center; margin-bottom: 20px;">Variação dos Parâmetros ao Longo do Tempo</h2>
      <div class="grid-charts">
        <div class="chart-container">
          <canvas id="chartTemp"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="chartPH"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="chartTDS"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="chartTurb"></canvas>
        </div>
      </div>
    </div>

  </div>

  <!-- Libs do TensorFlow.js, Teachable Machine e Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="text/javascript">
    // ---------- CONFIGURAÇÃO DOS GRÁFICOS (CHART.JS) ----------
    const MAX_DATA_POINTS = 10; // Número de leituras mantidas no histórico do gráfico

    function criarGrafico(ctxId, label, color) {
      const ctx = document.getElementById(ctxId).getContext('2d');
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: label,
            data: [],
            borderColor: color,
            backgroundColor: color + '22',
            borderWidth: 2,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { display: true, title: { display: false } },
            y: { beginAtZero: false }
          }
        }
      });
    }

    const chartTemp = criarGrafico('chartTemp', 'Temperatura (°C)', '#e63946');
    const chartPH   = criarGrafico('chartPH', 'pH', '#2a9d8f');
    const chartTDS  = criarGrafico('chartTDS', 'TDS (ppm)', '#e76f51');
    const chartTurb = criarGrafico('chartTurb', 'Turbidez (NTU)', '#0077b6');

    function adicionarDadoGrafico(chart, valor) {
      const horaAtual = new Date().toLocaleTimeString();
      if (chart.data.labels.length >= MAX_DATA_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.data.labels.push(horaAtual);
      chart.data.datasets[0].data.push(valor);
      chart.update();
    }

    // ---------- LÓGICA DO TEACHABLE MACHINE ----------
    const MODEL_URL = "./my_model/";
    let model, webcam, labelContainer, maxPredictions;

    async function initCamera() {
      const modelPath = MODEL_URL + "model.json";
      const metadataPath = MODEL_URL + "metadata.json";

      try {
        model = await tmImage.load(modelPath, metadataPath);
        maxPredictions = model.getTotalClasses();

        const flip = true;
        webcam = new tmImage.Webcam(240, 240, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loopCamera);

        const webcamContainer = document.getElementById("webcam-container");
        webcamContainer.innerHTML = ""; 
        webcamContainer.appendChild(webcam.canvas);

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const div = document.createElement("div");
          div.className = "label-item";
          labelContainer.appendChild(div);
        }
      } catch (err) {
        console.error("Erro ao inicializar Teachable Machine:", err);
        alert("Erro ao carregar os arquivos do modelo. Verifique a pasta 'my_model'.");
      }
    }

    async function loopCamera() {
      webcam.update();
      await predictImage();
      window.requestAnimationFrame(loopCamera);
    }

    async function predictImage() {
      const prediction = await model.predict(webcam.canvas);
      for (let i = 0; i < maxPredictions; i++) {
        const percent = (prediction[i].probability * 100).toFixed(0);
        const classPrediction = `${prediction[i].className}: ${percent}%`;
        labelContainer.childNodes[i].innerHTML = classPrediction;
      }
    }

    // ---------- LÓGICA DA WEB SERIAL (ARDUINO) ----------
    async function conectarArduino() {
      if (!("serial" in navigator)) {
        alert("A Web Serial API não é suportada neste navegador. Use Google Chrome, Edge ou Brave.");
        return;
      }

      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });

        const statusEl = document.getElementById("status-conexao");
        statusEl.innerText = "Status: Arduino conectado e transmitindo dados!";
        statusEl.style.color = "#2a9d8f";

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();

        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += value;
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const linhaLimpa = line.trim();
            if (linhaLimpa.startsWith("{") && linhaLimpa.endsWith("}")) {
              try {
                const dados = JSON.parse(linhaLimpa);

                if (dados.temp !== undefined) {
                  document.getElementById("temp").innerText = dados.temp;
                  adicionarDadoGrafico(chartTemp, dados.temp);
                }
                if (dados.ph !== undefined) {
                  document.getElementById("ph").innerText = dados.ph;
                  adicionarDadoGrafico(chartPH, dados.ph);
                }
                if (dados.tds !== undefined) {
                  document.getElementById("tds").innerText = dados.tds;
                  adicionarDadoGrafico(chartTDS, dados.tds);
                }
                if (dados.turb !== undefined) {
                  document.getElementById("turb").innerText = dados.turb;
                  adicionarDadoGrafico(chartTurb, dados.turb);
                }
              } catch (e) {
                console.warn("Falha ao analisar pacote JSON:", e);
              }
            }
          }
        }
      } catch (err) {
        console.error("Erro na conexão Serial:", err);
        const statusEl = document.getElementById("status-conexao");
        statusEl.innerText = "Status: Falha na conexão com o Arduino.";
        statusEl.style.color = "#e63946";
      }
    }
  </script>
</body>
</html>
